<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido de ajuda</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --text: #1d2733; --muted: #5b6b7c;
    --line: #d5dce4; --accent: #1f6feb; --error: #c62828; --ok: #1b7f4b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d; --card: #1b222b; --text: #e8edf2; --muted: #9aa8b6;
      --line: #313c48; --accent: #5b9dff; --error: #ff8a80; --ok: #5fd39a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  label { display: block; font-weight: 600; margin-top: 16px; }
  label:first-of-type { margin-top: 0; }
  .dica { display: block; font-weight: 400; font-size: .85rem; color: var(--muted); }
  textarea {
    width: 100%; margin-top: 6px; padding: 10px; font: inherit; color: inherit;
    background: transparent; border: 1px solid var(--line); border-radius: 6px; resize: vertical; min-height: 64px;
  }
  textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  textarea.invalido { border-color: var(--error); }
  .erro { color: var(--error); font-size: .85rem; min-height: 1.2em; margin: 4px 0 0; }
  .contador { font-size: .8rem; color: var(--muted); text-align: right; }
  button {
    font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; margin-top: 20px;
  }
  button.sec { background: transparent; color: var(--accent); }
  #resultado { display: none; margin-top: 24px; }
  #mensagem {
    white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 14px; font-family: ui-monospace, Consolas, monospace; font-size: .9rem;
  }
  #status { color: var(--ok); margin-left: 10px; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Pedido de ajuda</h1>
  <p class="sub">Escreva o pedido completo de uma vez, para quem lê conseguir ajudar sem perguntar nada.</p>

  <form class="card" id="form" novalidate>
    <label for="querer">1. O que eu quero fazer
      <span class="dica">Seu objetivo, antes do problema.</span></label>
    <textarea id="querer" name="querer"></textarea>
    <p class="erro" data-erro="querer"></p>

    <label for="acontecendo">2. O que está acontecendo
      <span class="dica">O comportamento ou a mensagem de erro, exatamente como aparece.</span></label>
    <textarea id="acontecendo" name="acontecendo"></textarea>
    <p class="erro" data-erro="acontecendo"></p>

    <label for="onde">3. Onde
      <span class="dica">Arquivo, linha, tela ou rota.</span></label>
    <textarea id="onde" name="onde"></textarea>
    <p class="erro" data-erro="onde"></p>

    <label for="tentei">4. O que já tentei
      <span class="dica">Mínimo de 20 caracteres. É o que separa pedir ajuda de pedir para alguém fazer por você.</span></label>
    <textarea id="tentei" name="tentei"></textarea>
    <div class="contador" id="contador">0 / 20</div>
    <p class="erro" data-erro="tentei"></p>

    <label for="preciso">5. O que preciso de você
      <span class="dica">Confirmar uma suspeita, indicar um material, revisar um trecho...</span></label>
    <textarea id="preciso" name="preciso"></textarea>
    <p class="erro" data-erro="preciso"></p>

    <button type="submit">Gerar mensagem</button>
  </form>

  <section id="resultado" aria-live="polite">
    <h2>Mensagem pronta</h2>
    <div id="mensagem"></div>
    <button type="button" id="copiar">Copiar mensagem</button>
    <button type="button" class="sec" id="novo">Escrever outro pedido</button>
    <span id="status"></span>
  </section>
</main>

<script>
  const MIN_TENTEI = 20;
  const campos = ["querer", "acontecendo", "onde", "tentei", "preciso"];
  const nomes = {
    querer: "O que quero fazer", acontecendo: "O que está acontecendo", onde: "Onde",
    tentei: "O que já tentei", preciso: "O que preciso de você"
  };

  const form = document.getElementById("form");
  const resultado = document.getElementById("resultado");
  const mensagem = document.getElementById("mensagem");
  const status = document.getElementById("status");
  const contador = document.getElementById("contador");

  function mostrarErro(id, texto) {
    const campo = document.getElementById(id);
    document.querySelector('[data-erro="' + id + '"]').textContent = texto;
    campo.classList.toggle("invalido", Boolean(texto));
    if (texto) campo.setAttribute("aria-invalid", "true");
    else campo.removeAttribute("aria-invalid");
  }

  function validar() {
    let primeiroInvalido = null;
    for (const id of campos) {
      const valor = document.getElementById(id).value.trim();
      let erro = "";
      if (valor === "") erro = 'Preencha "' + nomes[id] + '".';
      else if (id === "tentei" && valor.length < MIN_TENTEI)
        erro = 'Descreva melhor o que você já tentou (mínimo de ' + MIN_TENTEI + ' caracteres, faltam ' + (MIN_TENTEI - valor.length) + ').';
      mostrarErro(id, erro);
      if (erro && !primeiroInvalido) primeiroInvalido = id;
    }
    return primeiroInvalido;
  }

  document.getElementById("tentei").addEventListener("input", (e) => {
    contador.textContent = e.target.value.trim().length + " / " + MIN_TENTEI;
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const invalido = validar();
    if (invalido) {
      resultado.style.display = "none";
      document.getElementById(invalido).focus();
      return;
    }
    const v = (id) => document.getElementById(id).value.trim();
    mensagem.textContent =
      "Preciso de ajuda.\n\n" +
      "O que quero fazer: " + v("querer") + "\n" +
      "O que está acontecendo: " + v("acontecendo") + "\n" +
      "Onde: " + v("onde") + "\n" +
      "O que já tentei: " + v("tentei") + "\n" +
      "Preciso de: " + v("preciso");
    status.textContent = "";
    resultado.style.display = "block";
    resultado.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });

  document.getElementById("copiar").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(mensagem.textContent);
      status.textContent = "Mensagem copiada.";
    } catch (err) {
      const area = document.createElement("textarea");
      area.value = mensagem.textContent;
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
      status.textContent = "Mensagem copiada.";
    }
  });

  document.getElementById("novo").addEventListener("click", () => {
    form.reset();
    contador.textContent = "0 / 20";
    campos.forEach((id) => mostrarErro(id, ""));
    resultado.style.display = "none";
    document.getElementById("querer").focus();
  });
</script>
</body>
</html>
